apiVersion: apps/v1
kind: Deployment
metadata:
  name: sable-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sable-frontend
  template:
    metadata:
      labels:
        app: sable-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/dept-sable-prod/sable-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE
              value: "https://sable-api-dept-sable-prod.apps.cloudapps.unc.edu"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sable-frontend
spec:
  selector:
    app: sable-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sable-frontend
spec:
  to:
    kind: Service
    name: sable-frontend
  tls:
    termination: edge