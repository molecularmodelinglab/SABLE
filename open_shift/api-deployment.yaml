apiVersion: apps/v1
kind: Deployment
metadata:
  name: sable-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sable-api
  template:
    metadata:
      labels:
        app: sable-api
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/dept-sable-prod/sable-api:latest
          ports:
            - containerPort: 8000
          command: ["/bin/bash", "-lc"]
          args:
            - |
              micromamba run -n sable uvicorn server.app:app \
                --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: sable-config
            - secretRef:
                name: sable-secrets
          env:
            - name: CORS_ORIGINS
              value: "https://sable-frontend-dept-sable-prod.apps.cloudapps.unc.edu"
          volumeMounts:
            - name: artifacts
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: sable-artifacts