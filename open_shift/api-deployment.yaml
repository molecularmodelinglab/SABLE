apiVersion: apps/v1
kind: Deployment
metadata:
  name: lizard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lizard-api
  template:
    metadata:
      labels:
        app: lizard-api
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/dept-lizard-prod/lizard-api:latest
          ports:
            - containerPort: 8000
          command: ["/bin/bash", "-lc"]
          args:
            - |
              micromamba run -n lizard uvicorn server.app:app \
                --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: lizard-config
            - secretRef:
                name: lizard-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: lizard-artifacts