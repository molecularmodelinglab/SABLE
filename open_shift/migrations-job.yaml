apiVersion: batch/v1
kind: Job
metadata:
  name: sable-migrations
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: image-registry.openshift-image-registry.svc:5000/dept-sable-prod/sable-api:latest
          command: ["/bin/bash", "-lc", "micromamba run -n sable alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: sable-config
            - secretRef:
                name: sable-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sable-secrets
                  key: DATABASE_URL