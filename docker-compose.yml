services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lizard-postgres
    environment:
      POSTGRES_DB: lizard
      POSTGRES_USER: lizard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lizard_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lizard_user -d lizard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lizard-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lizard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lizard-network
    restart: unless-stopped

  # Database Migrations (runs once then exits)
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizard-migrations
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n lizard alembic upgrade head"]
    environment:
      - DATABASE_URL=postgresql://lizard_user:${POSTGRES_PASSWORD:-lizard_password}@postgres:5432/lizard
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lizard-network

  # LIZARD API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizard-api
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n lizard uvicorn server.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lizard_user:${POSTGRES_PASSWORD:-lizard_password}@postgres:5432/lizard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
    volumes:
      - ./data:/app/data  # For large artifacts (checkpoints, results)
      - ./logs:/app/logs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - lizard-network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizard-worker
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n lizard celery -A server.tasks.celery_app worker --loglevel=info"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lizard_user:${POSTGRES_PASSWORD:-lizard_password}@postgres:5432/lizard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HPC_HOST=${HPC_HOST}
      - HPC_USER=${HPC_USER}
      - REMOTE_BASE_DIR=${REMOTE_BASE_DIR}
      - BOLTZ_RESOURCES_DIR=${BOLTZ_RESOURCES_DIR}
      - HPC_SSH_KEY=/app/secrets/hpc_ssh_key
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
      - ./secrets/hpc_ssh_key:/app/secrets/hpc_ssh_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lizard-network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizard-beat
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n lizard celery -A server.tasks.celery_app beat --loglevel=info --schedule /app/data/celerybeat-schedule"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lizard_user:${POSTGRES_PASSWORD:-lizard_password}@postgres:5432/lizard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lizard-network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    image: mher/flower
    container_name: lizard-flower
    profiles: ["dev"]
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lizard-network
    restart: unless-stopped

  # Frontend development server (Vite)
  ui:
    image: node:20-alpine
    container_name: lizard-ui
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - lizard-network
    profiles: ["dev"]
    restart: unless-stopped

  # Production frontend served via Nginx with static build
  frontend:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: lizard-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - lizard-network
    profiles: ["prod"]
    restart: unless-stopped

  # CLI/Workflow Runner (original lizard service)
  lizard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizard-cli
    image: lizard:latest
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"] # Keep container running without auto-starting workflow
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lizard_user:${POSTGRES_PASSWORD:-lizard_password}@postgres:5432/lizard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lizard-network
    # command: ["run", "Optimize aspirin for better QED and solubility. Enumerate 50 analogs and run 3 iterations."]

networks:
  lizard-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ui_node_modules:

secrets:
  hpc_ssh_key:
    file: ${HPC_SSH_KEY:-./secrets/hpc_ssh_key}