services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sable-postgres
    environment:
      POSTGRES_DB: sable
      POSTGRES_USER: sable_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sable_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sable_user -d sable"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sable-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sable-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sable-network
    restart: unless-stopped

  # Database Migrations (runs once then exits)
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sable-migrations
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n sable alembic upgrade head"]
    environment:
      - DATABASE_URL=postgresql://sable_user:${POSTGRES_PASSWORD:-sable_password}@postgres:5432/sable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sable-network

  # SABLE API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sable-api
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n sable uvicorn server.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://sable_user:${POSTGRES_PASSWORD:-sable_password}@postgres:5432/sable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - MOLECULAR_FP=${MOLECULAR_FP:-MORDRED}
      - MULTI_OPT_TYPE=${MULTI_OPT_TYPE:-pareto}
      - HEALER_EXECUTION_MODE=${HEALER_EXECUTION_MODE:-internal}
      - HEALER_ENDPOINT=${HEALER_ENDPOINT:-}
      - HEALER_STOCK=${HEALER_STOCK:-US_stock}
      - HEALER_POLL_INTERVAL_SECONDS=${HEALER_POLL_INTERVAL_SECONDS:-2}
      - HEALER_JOB_TIMEOUT_SECONDS=${HEALER_JOB_TIMEOUT_SECONDS:-900}
      - HEALER_HTTP_TIMEOUT_SECONDS=${HEALER_HTTP_TIMEOUT_SECONDS:-30}
      - HEALER_OUTPUT_DIR=${HEALER_OUTPUT_DIR:-data/healer_outputs}
    volumes:
      - ./data:/app/data  # For large artifacts (checkpoints, results)
      - ./logs:/app/logs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - sable-network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sable-worker
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n sable celery -A server.tasks.celery_app worker --loglevel=info"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://sable_user:${POSTGRES_PASSWORD:-sable_password}@postgres:5432/sable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HPC_HOST=${HPC_HOST}
      - HPC_USER=${HPC_USER}
      - HPC_PASSWORD=${HPC_PASSWORD:-}
      - HPC_SSH_KEY_CONTENT=${HPC_SSH_KEY_CONTENT:-}
      - REMOTE_BASE_DIR=${REMOTE_BASE_DIR}
      - BOLTZ_RESOURCES_DIR=${BOLTZ_RESOURCES_DIR}
      - BOLTZ_EXECUTION_MODE=${BOLTZ_EXECUTION_MODE:-api}
      - MOLECULAR_FP=${MOLECULAR_FP:-MORDRED}
      - MULTI_OPT_TYPE=${MULTI_OPT_TYPE:-pareto}
      - HEALER_EXECUTION_MODE=${HEALER_EXECUTION_MODE:-internal}
      - HEALER_ENDPOINT=${HEALER_ENDPOINT:-}
      - HEALER_STOCK=${HEALER_STOCK:-US_stock}
      - HEALER_POLL_INTERVAL_SECONDS=${HEALER_POLL_INTERVAL_SECONDS:-2}
      - HEALER_JOB_TIMEOUT_SECONDS=${HEALER_JOB_TIMEOUT_SECONDS:-900}
      - HEALER_HTTP_TIMEOUT_SECONDS=${HEALER_HTTP_TIMEOUT_SECONDS:-30}
      - HEALER_OUTPUT_DIR=${HEALER_OUTPUT_DIR:-data/healer_outputs}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sable-network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sable-beat
    profiles: ["dev", "prod"]
    entrypoint: ["bash", "-lc"]
    command: ["micromamba run -n sable celery -A server.tasks.celery_app beat --loglevel=info --schedule /app/data/celerybeat-schedule"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://sable_user:${POSTGRES_PASSWORD:-sable_password}@postgres:5432/sable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BOLTZ_EXECUTION_MODE=${BOLTZ_EXECUTION_MODE:-api}
      - MOLECULAR_FP=${MOLECULAR_FP:-MORDRED}
      - MULTI_OPT_TYPE=${MULTI_OPT_TYPE:-pareto}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sable-network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    image: mher/flower
    container_name: sable-flower
    profiles: ["dev"]
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sable-network
    restart: unless-stopped

  # Frontend development server (Vite)
  ui:
    image: node:20-alpine
    container_name: sable-ui
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - sable-network
    profiles: ["dev"]
    restart: unless-stopped

  # Production frontend served via Nginx with static build
  frontend:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: sable-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - sable-network
    profiles: ["prod"]
    restart: unless-stopped

  # CLI/Workflow Runner (original sable service)
  sable:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sable-cli
    image: sable:latest
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"] # Keep container running without auto-starting workflow
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://sable_user:${POSTGRES_PASSWORD:-sable_password}@postgres:5432/sable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MOLECULAR_FP=${MOLECULAR_FP:-MORDRED}
      - MULTI_OPT_TYPE=${MULTI_OPT_TYPE:-pareto}
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sable-network
    # command: ["run", "Optimize aspirin for better QED and solubility. Enumerate 50 analogs and run 3 iterations."]

networks:
  sable-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ui_node_modules:
