tools:
  - id: hybrid_argument_extractor
    kind: argument_extractor
    class_path: nodes.argument_extraction:HybridArgumentExtractor
    enabled: true
    priority: 10
    capability:
      provides:
        - parsed_arguments
        - starting_molecules
        - target_properties
        - protein_targets
      accepts:
        - hybrid
        - llm
        - rule_based
      local: true
    metadata:
      node: nodes.extract_arguments_hybrid:extract_arguments_node

  - id: rule_argument_extractor
    kind: argument_extractor
    class_path: nodes.argument_extraction:RuleArgumentExtractor
    enabled: true
    priority: 50
    capability:
      provides:
        - parsed_arguments
        - starting_molecules
        - target_properties
      accepts:
        - rule_based
      local: true

  - id: healer
    kind: enumerator
    class_path: tools.healer_enumerator_tool:HealerEnumeratorTool
    enabled: true
    priority: 10
    capability:
      provides:
        - analog_enumeration
        - search_space
      accepts:
        - reaction_based
        - enumerated
        - provided
        - analog_enumeration
        - MoleculeHEALER
        - FragmentHEALER
        - SiteHEALER
      batch: false
      local: true
      cost: medium
    config:
      healer_mode: MoleculeHEALER
    metadata:
      tool_specific_options:
        - healer_mode

  - id: baybe
    kind: optimizer
    class_path: tools.baybe_optimizer_tool:BayBEOptimizerTool
    enabled: true
    priority: 10
    capability:
      provides:
        - batch_recommendations
        - model_metrics
      accepts:
        - expected_improvement
        - pareto
        - desirability
      batch: true
      local: true
      cost: medium

  - id: rdkit
    kind: characterizer
    class_path: tools.molecule_characterization_tool:MoleculeCharacterizationTool
    enabled: true
    priority: 10
    capability:
      provides:
        - molecular_formula
        - exact_mass
        - molecular_weight
        - heavy_atom_count
        - ring_count
        - aromatic_ring_count
        - h_bond_donors
        - h_bond_acceptors
        - rotatable_bonds
        - logp
        - tpsa
        - qed
      batch: true
      local: true
      cost: low

  - id: stoplight
    kind: characterizer
    class_path: tools.stoplight_tool:StoplightTool
    enabled: true
    priority: 30
    capability:
      provides:
        - alogp
        - ampc_aggregation
        - cns_activity
        - cruzain_aggregation
        - fsp3
        - firefly_luciferase
        - hba
        - hbd
        - molecular_weight
        - heavy_atom_count
        - ring_count
        - rotatable_bonds
        - logp
        - tpsa
        - nano_luciferase
        - num_heavy_atoms
        - num_quaternary_carbons
        - number_of_rings
        - number_of_rotatable_bonds
        - polar_surface_area
        - redox_interference
        - solubility_water
        - thiol_interference
        - solubility
      batch: true
      local: false
      cost: medium

  - id: boltz
    kind: characterizer
    class_path: tools.boltz_tool:BoltzTool
    enabled: true
    priority: 50
    capability:
      provides:
        - binding_affinity
      requires:
        - protein_targets
      batch: true
      local: false
      cost: high

  # NERDD modules (https://nerdd.univie.ac.at). Each module is registered as its own
  # characterizer so the registry can select exactly the module a target needs.
  - id: nerdd_cypstrate
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - cyp1a2_substrate
        - cyp2a6_substrate
        - cyp2b6_substrate
        - cyp2c8_substrate
        - cyp2c9_substrate
        - cyp2c19_substrate
        - cyp2d6_substrate
        - cyp2e1_substrate
        - cyp3a4_substrate
        - cyp_substrate_count
        - cyp_substrate_coverage
      batch: true
      local: false
      cost: medium
    config:
      module: cypstrate
    metadata:
      tool_specific_options:
        - prediction_mode

  - id: nerdd_cyplebrity
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - cyp1a2_inhibition
        - cyp2c9_inhibition
        - cyp2c19_inhibition
        - cyp2d6_inhibition
        - cyp3a4_inhibition
        - cyp_inhibition_risk
      batch: true
      local: false
      cost: medium
    config:
      module: cyplebrity

  - id: nerdd_hitdexter3
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - promiscuity_target_based
        - promiscuity_target_based_high
        - promiscuity_cell_based
        - promiscuity_cell_based_high
        - promiscuity_cell_based_extended
        - promiscuity_cell_based_extended_high
        - promiscuity_risk
      batch: true
      local: false
      cost: medium
    config:
      module: hitdexter3

  - id: nerdd_np_scout
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - np_likeness
      batch: true
      local: false
      cost: medium
    config:
      module: np_scout

  - id: nerdd_skin_doctor_cp
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - skin_sensitization_probability
        - skin_nonsensitization_probability
      batch: true
      local: false
      cost: medium
    config:
      module: skin_doctor_cp

  - id: nerdd_fame3r
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 40
    capability:
      provides:
        - som_max_probability
        - som_mean_probability
        - som_count
      batch: true
      local: false
      cost: high
    config:
      module: fame3r
    metadata:
      tool_specific_options:
        - metabolism_subset

  - id: nerdd_awesom
    kind: characterizer
    class_path: tools.nerdd_tool:NerddTool
    enabled: true
    priority: 45
    capability:
      provides:
        - awesom_som_max_probability
        - awesom_som_mean_probability
        - awesom_som_count
        - awesom_total_uncertainty
      batch: true
      local: false
      cost: high
    config:
      module: awesom

  - id: default_summarizer
    kind: summarizer
    class_path: nodes.summarize_results:summarize_results_node
    enabled: true
    priority: 10
    capability:
      provides:
        - summary
      local: true
