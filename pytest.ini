[pytest]
# Pytest configuration for SABLE

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Addopts - additional options for pytest
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=server
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --maxfail=5
    --durations=10

# Markers for organizing tests
markers =
    unit: Unit tests that test individual functions/classes
    integration: Integration tests that test multiple components together
    e2e: End-to-end tests that test complete user flows
    auth: Tests related to authentication
    admin: Tests related to administrator capabilities
    cache: Tests related to Redis caching
    database: Tests that require database access
    slow: Tests that take a long time to run
    api: Tests for API endpoints

# Coverage options
[coverage:run]
source = server
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
